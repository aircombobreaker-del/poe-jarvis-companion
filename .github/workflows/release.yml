name: Build Windows & macOS Releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable (.exe)
        run: python build_app.py

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoE_Jarvis_Companion_Windows
          path: dist/PoE_Jarvis_Companion_Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/setup-python@v5
        if: false
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS Application (.app)
        run: python build_app.py

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoE_Jarvis_Companion_macOS
          path: dist/PoE_Jarvis_Companion_macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PoE Jarvis Companion v1.0.1 (Windows & macOS)"
          files: |
            release_assets/PoE_Jarvis_Companion_Windows/PoE_Jarvis_Companion_Windows.zip
            release_assets/PoE_Jarvis_Companion_macOS/PoE_Jarvis_Companion_macOS.zip
          generate_release_notes: true
